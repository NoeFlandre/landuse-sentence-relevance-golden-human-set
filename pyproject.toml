[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "landuse-sentence-relevance-golden-human-set"
version = "2.0.0"
description = "A streamed, geographically stratified UI for building a human sentence-relevance golden set."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "Noe Flandre" }]
dependencies = [
    "datasets>=4.4,<5",
    "fastapi>=0.116,<1",
    "h3>=4.3,<5",
    "huggingface-hub>=0.35,<2",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "numpy>=2.2,<3",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
models = [
    "torch>=2.7,<3",
    "wtpsplit[onnx-cpu]>=2.2,<3",
]

[project.scripts]
landuse-annotate = "landuse_sentence_relevance.web.app:run"

[dependency-groups]
dev = [
    "mutmut>=3.4,<4",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
    "playwright>=1.55,<2",
    "pytest>=8.4,<9",
    "pytest-bdd>=8.1,<9",
    "pytest-cov>=6.2,<7",
    "radon>=6.0,<7",
    "ruff>=0.14,<1",
    "ty>=0.0.1,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/landuse_sentence_relevance"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "scripts",
    "docs",
    "README.md",
    "LICENSE",
    "CITATION.cff",
    "Dockerfile",
    ".dockerignore",
    "mkdocs.yml",
    "pyproject.toml",
    "uv.lock",
]
exclude = [
    "data/**",
    "dist/**",
    "site/**",
    "models/**",
    "mutants/**",
    "tmp/**",
    "uv-cache*/**",
    "uv-environment/**",
    "uv-python/**",
    "python-cache/**",
    "runtime-cache/**",
    "huggingface-auth/**",
    "xdg-cache/**",
    "**/__pycache__",
    "**/.pytest_cache",
    "**/.ruff_cache",
]

[tool.uv]
default-groups = ["dev"]
required-version = "0.11.16"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.analysis]
allowed-unresolved-imports = ["torch", "torch.**", "wtpsplit"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "acceptance: browser-level Gherkin acceptance tests",
]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["landuse_sentence_relevance"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.mutmut]
source_paths = [
    "src/landuse_sentence_relevance/domain",
    "src/landuse_sentence_relevance/storage",
    "src/landuse_sentence_relevance/sources/validation.py",
    "src/landuse_sentence_relevance/sources/website_text.py",
    "src/landuse_sentence_relevance/sources/website_discovery.py",
]
also_copy = ["src/landuse_sentence_relevance", "scripts"]
on_dependency_change = "rerun"
pytest_add_cli_args = [
    "--ignore=tests/acceptance",
    "--ignore=tests/unit/test_public_project_files.py",
]
pytest_add_cli_args_test_selection = [
    "tests/unit/domain",
    "tests/unit/sources/test_validation.py",
    "tests/unit/sources/test_website.py",
    "tests/unit/sources/test_website_helpers.py",
    "tests/unit/storage",
    "tests/unit/test_models.py",
    "tests/unit/test_constraints.py",
    "tests/unit/test_sampling.py",
    "tests/unit/test_selection.py",
    "tests/unit/test_stratification.py",
]
