name: QA gauntlet

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gauntlet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version-file: .uv-version
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python scripts/gauntlet.py
