site_name: Land-use sentence relevance golden human set
site_url: https://noeflandre.github.io/landuse-sentence-relevance-golden-human-set/
repo_name: NoeFlandre/landuse-sentence-relevance-golden-human-set
repo_url: https://github.com/NoeFlandre/landuse-sentence-relevance-golden-human-set
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Data sources: data-sources.md
  - Annotation: annotation.md
  - Data catalogue: results.md
  - LLM labeling: llm-labeling.md
  - LLM evaluation rounds: llm-evaluation-rounds.md
  - V3 independent GPT review: v3-gpt-independent-review.md
  - Interrater agreement: interrater-agreement.md
  - V3 workflow: v3.md
  - Engineering:
      - Versioning: versioning.md
      - QA: qa.md
      - Architecture decisions:
          - Quality gauntlet: adr/0001-quality-gauntlet.md
          - Layered architecture: adr/0002-layered-architecture.md
      - Technical debt: technical-debt.md
  - Licensing: licensing.md
